<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETE — Painel de Monitoramento</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --border: #2d3748;
  --accent: #00d4aa; --accent2: #4f9cf9; --accent3: #f59e42;
  --red: #ff5e57; --green: #23d160; --yellow: #f5a623;
  --text: #e6edf3; --muted: #8b949e; --ok: #23d160; --warn: #f5a623; --danger: #ff5e57;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #0d2137, #0a1f2e, #091a27);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px; display: flex; align-items: center; gap: 14px;
  box-shadow: 0 4px 24px rgba(0, 212, 170, .08);
}
.logo { width: 42px; height: 42px; background: linear-gradient(135deg, var(--accent), #00a37a); border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
header h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; }
header .hsub { font-size: .74rem; color: var(--muted); }

#btn-refresh {
  background: none; border: 1px solid var(--border); color: var(--accent);
  cursor: pointer; font-size: .9rem; padding: 5px 11px; border-radius: 7px;
  font-weight: 600; transition: all .2s; margin-left: auto;
}
#btn-refresh:hover { background: rgba(0, 212, 170, .1); }
#btn-refresh.spinning { animation: spin .6s linear infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }

nav { background: var(--panel); border-bottom: 1px solid var(--border); display: flex; padding: 0 20px; }
nav button { background: none; border: none; color: var(--muted); cursor: pointer; padding: 13px 18px; font-size: .84rem; font-weight: 500; border-bottom: 2px solid transparent; transition: all .2s; }
nav button:hover { color: var(--text); }
nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

.tab-content { display: none; }
.tab-content.active { display: block; }
.dash { padding: 22px 28px; }

.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px; margin-bottom: 20px;
}
.kpi {
  background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
  padding: 14px 16px; position: relative; overflow: hidden; transition: transform .15s;
}
.kpi::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--kpi-color, var(--accent)); }
.kpi-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 5px; }
.kpi-val { font-family: 'Syne', sans-serif; font-size: 1.75rem; font-weight: 700; }
.kpi-unit { font-size: .68rem; color: var(--muted); margin-left: 3px; }
.kpi-status { display: inline-flex; align-items: center; gap: 3px; font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 5px; }
.kpi-status.ok { background: rgba(35, 209, 96, .12); color: var(--ok); }
.kpi-status.warn { background: rgba(245, 166, 35, .12); color: var(--warn); }
.kpi-status.danger { background: rgba(255, 94, 87, .12); color: var(--danger); }

.alert-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;
}
.alert-chip {
  background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
  padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.chip-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; }
.chip-val { font-size: 1.25rem; font-weight: 800; }
.chip-badge { display: inline-flex; padding: 2px 9px; border-radius: 20px; font-size: .7rem; font-weight: 700; }
.alert-chip.ok .chip-badge { background: rgba(35, 209, 96, .1); border: 1px solid rgba(35, 209, 96, .3); color: var(--ok); }
.alert-chip.ok .chip-val { color: var(--ok); }
.alert-chip.warn .chip-badge { background: rgba(245, 166, 35, .1); border: 1px solid rgba(245, 166, 35, .3); color: var(--warn); }
.alert-chip.warn .chip-val { color: var(--warn); }
.alert-chip.danger .chip-badge { background: rgba(255, 94, 87, .1); border: 1px solid rgba(255, 94, 87, .3); color: var(--danger); }
.alert-chip.danger .chip-val { color: var(--danger); }

.gauge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
.gauge-card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 18px; text-align: center; }
.gauge-val { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; }

.charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-bottom: 20px; }
.chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 18px; }
.chart-card.full { grid-column: 1 / -1; }
.chart-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: .88rem; margin-bottom: 8px; }

.toast {
  position: fixed; bottom: 20px; right: 20px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 7px; padding: 12px 16px;
  font-size: .85rem; animation: slideIn .3s ease-out;
}
@keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<header>
  <div class="logo">📊</div>
  <div>
    <h1>ETE Danone — IVL Dashboard</h1>
    <div class="hsub" id="last-update"></div>
  </div>
  <button id="btn-refresh" onclick="refreshData()" title="Ctrl+R">⟳ Recarregar</button>
</header>

<nav id="tabs-nav"></nav>

<div id="tabs-container"></div>

<script>
// ============ CONFIG ============
const CFG = {
  ivlMin: 100, ivlMax: 150, ivlMeta: 150,
  dqoMeta: 150, sstMeta: 100,
  idadeMin: 20, idadeMax: 30,
  amMin: 0.02, amMax: 0.25
};

// ============ STATE ============
let sessionData = [];
const CHART_REG = {};
let activeTab = 'Executivo';

// ============ UTILS ============
const f = (v, d = 1) => v == null ? '—' : Number(v).toFixed(d);
const fi = v => v == null ? '—' : Math.round(v).toLocaleString('pt-BR');
const fp = v => v == null ? '—' : v.toFixed(1) + '%';

// Status checkers
const sIVL = v => v == null ? { c: '', t: '' } : v > CFG.ivlMax ? { c: 'danger', t: ' ⚠ Crítica' } : v > 120 ? { c: 'warn', t: ' ⚠ Alta' } : { c: 'ok', t: ' ✓' };
const sDQO = v => v == null ? { c: '', t: '' } : v > CFG.dqoMeta ? { c: 'danger', t: ' ⚠' } : { c: 'ok', t: ' ✓' };
const sSST = v => v == null ? { c: '', t: '' } : v > CFG.sstMeta ? { c: 'danger', t: ' ⚠' } : { c: 'ok', t: ' ✓' };
const sIdade = v => v == null ? { c: '', t: '' } : v < CFG.idadeMin || v > CFG.idadeMax ? { c: 'warn', t: ' ⚠' } : { c: 'ok', t: ' ✓' };
const sAM = v => v == null ? { c: '', t: '' } : v < CFG.amMin || v > CFG.amMax ? { c: 'warn', t: ' ⚠' } : { c: 'ok', t: ' ✓' };

// ============ DATA GETTERS ============
const getLatest = () => sessionData.filter(r => !r.data || r.data <= new Date().toISOString().slice(0, 10))[sessionData.length - 1] || {};
const getAll = () => sessionData;
const getLastValid = (key) => {
  for (let i = sessionData.length - 1; i >= 0; i--) {
    if (sessionData[i][key] != null) return sessionData[i][key];
  }
  return null;
};

// ============ LOAD DATA ============
async function loadDados() {
  try {
    const resp = await fetch('dados.json', { cache: 'no-store' });
    if (!resp.ok) return;
    const j = await resp.json();
    if (Array.isArray(j.dados)) {
      sessionData = j.dados.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
      console.log('✅ Dados carregados:', sessionData.length, 'registros');
    }
  } catch (e) {
    console.warn('Erro ao carregar dados.json:', e);
  }
}

// ============ RENDER FUNCTIONS ============
function renderKPIs() {
  const r = getLatest();
  const kpis = [
    { label: 'IVL', val: r.ivl_calc || r.ivl, unit: 'mL/g', fmt: d => f(d, 0), stat: sIVL },
    { label: 'DQO Saída', val: r.dqo_saida, unit: 'mg/L', fmt: d => f(d, 0), stat: sDQO },
    { label: 'SST Efluente', val: r.sst_efluente, unit: 'mg/L', fmt: d => f(d, 0), stat: sSST },
    { label: 'Idade Lodo', val: getLastValid('idade_lodo'), unit: 'dias', fmt: d => f(d, 1), stat: sIdade },
    { label: 'pH Tanque', val: r.ph_tanque, unit: '', fmt: d => f(d, 2), stat: () => ({ c: '', t: '' }) },
    { label: 'OD Tanque', val: r.od_tanque, unit: 'mg/L', fmt: d => f(d, 2), stat: v => v == null ? { c: '', t: '' } : v >= 2 ? { c: 'ok', t: ' ✓' } : { c: 'warn', t: ' ⚠' } },
  ];
  const html = kpis.map(k => {
    const v = k.val;
    const st = k.stat(v);
    return `<div class="kpi" style="--kpi-color: var(--accent)">
      <div class="kpi-label">${k.label}</div>
      <div style="display: flex; align-items: baseline; gap: 3px;">
        <div class="kpi-val">${v == null ? '—' : k.fmt(v)}</div>
        <div class="kpi-unit">${k.unit}</div>
      </div>
      ${st.t ? `<div class="kpi-status ${st.c}">${st.t}</div>` : ''}
    </div>`;
  }).join('');
  const el = document.getElementById('kpi-grid');
  if (el) el.innerHTML = html;
}

function renderAlerts() {
  const r = getLatest();
  const items = [
    { label: 'IVL', val: r.ivl_calc || r.ivl, fmt: v => f(v, 0) + ' mL/g', stat: sIVL },
    { label: 'DQO Saída', val: r.dqo_saida, fmt: v => f(v, 0) + ' mg/L', stat: sDQO },
    { label: 'SST Efluente', val: r.sst_efluente, fmt: v => f(v, 0) + ' mg/L', stat: sSST },
    { label: 'Idade Lodo', val: getLastValid('idade_lodo'), fmt: v => f(v, 1) + ' dias', stat: sIdade },
  ];
  const html = items.map(i => {
    const v = i.val;
    const st = i.stat(v);
    return `<div class="alert-chip ${st.c || 'neutral'}">
      <div class="chip-label">${i.label}</div>
      <div class="chip-val">${v == null ? '—' : i.fmt(v)}</div>
      <div class="chip-badge">${st.t || '—'}</div>
    </div>`;
  }).join('');
  const el = document.getElementById('alerts-bar');
  if (el) el.innerHTML = html;
}

function renderGauges() {
  const r = getLatest();
  const ivl = r.ivl_calc || r.ivl;
  const idade = getLastValid('idade_lodo');
  const od = r.od_tanque;
  const am = getLastValid('relacao_am');

  const makeGauge = (id, value, min, max, colorFn) => {
    if (CHART_REG[id]) { CHART_REG[id].destroy(); delete CHART_REG[id]; }
    const ctx = document.getElementById(id)?.getContext('2d');
    if (!ctx) return;
    const pct = value != null ? Math.min(Math.max((value - min) / (max - min), 0.02), 1) : 0;
    const color = value != null ? colorFn(pct) : 'rgba(255, 255, 255, .08)';
    CHART_REG[id] = new Chart(ctx, {
      type: 'doughnut',
      data: { datasets: [{ data: [pct, 1 - pct], backgroundColor: [color, 'rgba(255, 255, 255, .05)'], borderWidth: 0, circumference: 180, rotation: 270 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '72%' }
    });
  };

  makeGauge('g-ivl', ivl, CFG.ivlMin, CFG.ivlMax, p => p < 0.5 ? '#23d160' : p < 0.75 ? '#f5a623' : '#ff5e57');
  document.getElementById('gv-ivl').textContent = ivl != null ? f(ivl, 0) : '—';

  makeGauge('g-idade', idade, 0, 40, p => p > 0.3 && p < 0.75 ? '#23d160' : '#f5a623');
  document.getElementById('gv-idade').textContent = idade != null ? f(idade, 1) : '—';

  makeGauge('g-od', od, 0, 6, p => p > 0.25 ? '#23d160' : '#ff5e57');
  document.getElementById('gv-od').textContent = od != null ? f(od, 2) : '—';

  makeGauge('g-am', am, 0, CFG.amMax * 2, p => p > 0.2 && p < 0.7 ? '#23d160' : '#f5a623');
  document.getElementById('gv-am').textContent = am != null && am > 0 ? f(am, 3) : '—';
}

function renderCharts() {
  if (sessionData.length < 2) return;

  const dates = sessionData.map(r => r.data || '?').slice(-30);
  const ivlData = sessionData.map(r => r.ivl_calc || r.ivl).slice(-30);
  const dqoData = sessionData.map(r => r.dqo_saida).slice(-30);

  const makeLineChart = (id, label, data, borderColor) => {
    if (CHART_REG[id]) CHART_REG[id].destroy();
    const ctx = document.getElementById(id)?.getContext('2d');
    if (!ctx) return;
    CHART_REG[id] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [{
          label: label,
          data: data,
          borderColor: borderColor,
          backgroundColor: borderColor + '15',
          borderWidth: 2,
          tension: 0.3,
          fill: true,
          pointRadius: 0,
          pointHoverRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, labels: { color: 'var(--text)', font: { size: 12 } } },
          tooltip: { backgroundColor: '#1c2330', titleColor: '#e6edf3', bodyColor: '#8b949e' }
        },
        scales: {
          x: { grid: { color: 'rgba(255, 255, 255, .05)' }, ticks: { color: '#8b949e' } },
          y: { grid: { color: 'rgba(255, 255, 255, .05)' }, ticks: { color: '#8b949e' } }
        }
      }
    });
  };

  makeLineChart('chart-ivl', 'IVL (mL/g)', ivlData, '#00d4aa');
  makeLineChart('chart-dqo', 'DQO Saída (mg/L)', dqoData, '#f59e42');
}

function renderAll() {
  const el = document.getElementById('last-update');
  if (el) {
    const latest = getLatest();
    el.textContent = latest.data ? `Último: ${latest.data} · ${sessionData.length} registros` : `${sessionData.length} registros`;
  }
  renderKPIs();
  renderAlerts();
  renderGauges();
  renderCharts();
}

// ============ REFRESH ============
async function refreshData() {
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  try {
    await loadDados();
    renderAll();
    showToast('✓ Dados recarregados', 'success');
  } catch (e) {
    showToast('✗ Erro ao recarregar', 'error');
    console.error(e);
  } finally {
    btn.classList.remove('spinning');
  }
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ============ TABS ============
function buildTabs() {
  const tabs = ['Executivo', 'Gráficos'];
  const navHtml = tabs.map(tab => `<button class="tab-btn ${tab === activeTab ? 'active' : ''}" onclick="switchTab('${tab}')">${tab}</button>`).join('');
  document.getElementById('tabs-nav').innerHTML = navHtml;

  const contentHtml = `
    <div id="tab-Executivo" class="tab-content active">
      <div id="kpi-grid" class="kpi-grid"></div>
      <div id="alerts-bar" class="alert-grid"></div>
      <div class="gauge-grid">
        <div class="gauge-card">
          <div style="font-size: .72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">IVL (mL/g)</div>
          <canvas id="g-ivl" style="height: 130px;"></canvas>
          <div style="margin-top: 8px; font-family: Syne; font-size: 1.5rem; font-weight: 800;" id="gv-ivl">—</div>
        </div>
        <div class="gauge-card">
          <div style="font-size: .72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">Idade Lodo (dias)</div>
          <canvas id="g-idade" style="height: 130px;"></canvas>
          <div style="margin-top: 8px; font-family: Syne; font-size: 1.5rem; font-weight: 800;" id="gv-idade">—</div>
        </div>
        <div class="gauge-card">
          <div style="font-size: .72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">OD Tanque (mg/L)</div>
          <canvas id="g-od" style="height: 130px;"></canvas>
          <div style="margin-top: 8px; font-family: Syne; font-size: 1.5rem; font-weight: 800;" id="gv-od">—</div>
        </div>
        <div class="gauge-card">
          <div style="font-size: .72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px;">Relação A/M</div>
          <canvas id="g-am" style="height: 130px;"></canvas>
          <div style="margin-top: 8px; font-family: Syne; font-size: 1.5rem; font-weight: 800;" id="gv-am">—</div>
        </div>
      </div>
    </div>

    <div id="tab-Gráficos" class="tab-content">
      <div class="charts-grid">
        <div class="chart-card full">
          <div class="chart-title">IVL (últimos 30 dias)</div>
          <canvas id="chart-ivl" style="height: 300px;"></canvas>
        </div>
        <div class="chart-card full">
          <div class="chart-title">DQO Saída (últimos 30 dias)</div>
          <canvas id="chart-dqo" style="height: 300px;"></canvas>
        </div>
      </div>
    </div>
  `;
  document.getElementById('tabs-container').innerHTML = contentHtml;
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
  if (tab === 'Gráficos') renderCharts();
}

// ============ INIT ============
(async () => {
  buildTabs();
  await loadDados();
  renderAll();
  console.log('✅ Dashboard pronto');
})();

// Hotkey Ctrl+R
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
    e.preventDefault();
    refreshData();
  }
});
</script>

</body>
</html>
